name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.cmake-preset }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cmake-preset: windows-x64-debug, runs-on: [windows-latest] }
          - { cmake-preset: windows-x64-release, runs-on: [windows-latest] }
          # - { cmake-preset: windows-x64-msbuild, runs-on: [windows-latest] }
          - { cmake-preset: linux-x64-debug, runs-on: [ubuntu-latest] }
          - { cmake-preset: linux-x64-release, runs-on: [ubuntu-latest] }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Setup Conan
        # On our Windows runner, conan comes pre-installed
        # if: runner.os == 'Linux'
        run: |
          pip3 install --user conan
      - name: Configure CMake project
        run: cmake --preset ${{ matrix.cmake-preset }}
      - name: Build CMake project
        run: cmake --build --preset ${{ matrix.cmake-preset }}
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.cmake-preset }}
          path: |
            build/${{ matrix.cmake-preset }}
            !build/CMakeFiles/
  tests:
    name: Tests (${{ matrix.cmake-preset }})
    needs: build
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cmake-preset: windows-x64-debug, runs-on: [windows-latest] }
          - { cmake-preset: linux-x64-debug, runs-on: [ubuntu-latest] }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.cmake-preset }}
          path: build/${{ matrix.cmake-preset }}
      - name: Fix permissions
        if: runner.os == 'Linux'
        run: |
          chmod +x build/${{ matrix.cmake-preset }}/tests/*_tests
      - name: Run CMake tests
        run: ctest --preset ${{ matrix.cmake-preset }}
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.cmake-preset }}
          path: build/${{ matrix.cmake-preset }}
